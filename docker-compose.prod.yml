# prod 오버라이드. base 위에 병합합니다 — scripts/deploy.sh prod up -d --build
#
# 값은 서버 .env 로 관리합니다(EC2 에 직접 접속해 수정하는 정책).
# Caddy 를 두는 이유와 caddy-data 볼륨을 지우면 안 되는 이유는 docs/배포환경에서_작업하는_방법.md 에 있습니다.

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: ktc4-caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN 이 없으면 인증서를 받을 수 없습니다}
      PUBLIC_DOMAIN_PREVIOUS: ${PUBLIC_DOMAIN_PREVIOUS:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 점주 앱·아동 앱의 웹판. 저장소 밖에 두어 배포(git reset --hard)에 날아가지 않게 한다.
      # 폴더가 없으면 도커가 빈 폴더로 만들고 /app/* 만 404 가 된다 — 나머지는 그대로 돈다.
      - ${APP_WEB_DIR:-/home/ubuntu/app-web}:/srv/app:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - db-net
    depends_on:
      - backend
      - frontend

  backend:
    environment:
      # prod 는 Caddy 한 대 뒤에 있습니다(8080 은 보안그룹에서 닫힘). 프록시가 없는 서버에는 넣지 마세요.
      # 없으면 모든 요청이 Caddy 주소로 보여 가입·카드 인증 횟수 제한을 시연장 전체가 나눠 씁니다.
      SIGNUP_TRUSTED_PROXIES: ${SIGNUP_TRUSTED_PROXIES:-1}

  frontend:
    build:
      args:
        VITE_BACKEND_URL: ${PUBLIC_BACKEND_URL:?PUBLIC_BACKEND_URL 이 없으면 번들에 옛 주소가 박힙니다}
    networks:
      - db-net

volumes:
  caddy-data:
  caddy-config:
