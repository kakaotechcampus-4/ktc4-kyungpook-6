services:
  postgres:
    image: postgres:16
    container_name: ktc4-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ktc4}
      POSTGRES_USER: ${POSTGRES_USER:-ktc4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktc4local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ktc4-backend
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ktc4}
      DB_USERNAME: ${DB_USERNAME:-ktc4}
      DB_PASSWORD: ${DB_PASSWORD:-ktc4local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_BASE_URL: http://ai:8000
      # AI 가 X-API-KEY 로 확인하는 키. 백엔드도 AI 를 부를 때 같은 키를 싣는다.
      # 비우면 AI 쪽 검사가 꺼지므로 로컬에서는 없어도 돈다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # 올라온 파일(가게 사진·사업자등록증)을 두는 폴더. 아래 volumes 의 경로와 같아야 한다.
      UPLOAD_DIR: /app/uploads
    volumes:
      # 컨테이너는 배포할 때마다 새로 만들어진다. 볼륨에 두지 않으면 올라온 파일이 그때 사라지고 DB 기록만 남는다.
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-net

  # AI 서비스. 백엔드가 `POST http://ai:8000/investigations` 로 부른다.
  #
  # 포트를 바깥으로 열지 않는다 — 백엔드만 부르면 되고, 열어 두면 공개 주소에서
  # 조사를 아무나 돌릴 수 있다(국세청·Vertex 쿼터가 걸린 호출이다).
  # 같은 db-net 안에 있어 서비스명으로 닿는다.
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ktc4-ai
    environment:
      BACKEND_BASE_URL: http://backend:8080
      # 조사 구현 선택: web / mock / off. 비우면 GOOGLE_CLOUD_PROJECT 유무로 정해진다.
      INVESTIGATOR: ${INVESTIGATOR:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      backend:
        condition: service_started
    networks:
      - db-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 브라우저가 읽는 공개 주소. 빌드할 때 박히므로 바꾸면 다시 빌드해야 한다.
        # PUBLIC_BACKEND_URL 이 없으면 옛 키(BACKEND_BASE_URL)로 떨어진다 — 서버 .env 를 고치기 전에
        # 머지돼도 화면이 죽지 않게 둔 것이다. 서버 .env 에 PUBLIC_BACKEND_URL 이 들어가면 이 폴백을 지운다.
        VITE_BACKEND_URL: ${PUBLIC_BACKEND_URL:-${BACKEND_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}}
    container_name: ktc4-frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-uploads:

networks:
  db-net:
