services:
  postgres:
    image: postgres:16
    container_name: ktc4-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ktc4}
      POSTGRES_USER: ${POSTGRES_USER:-ktc4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktc4local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ktc4-backend
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ktc4}
      DB_USERNAME: ${DB_USERNAME:-ktc4}
      DB_PASSWORD: ${DB_PASSWORD:-ktc4local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8080}}
    container_name: ktc4-frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres-data:

networks:
  db-net:
