services:
  postgres:
    image: postgres:16
    container_name: ktc4-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ktc4}
      POSTGRES_USER: ${POSTGRES_USER:-ktc4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktc4local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ktc4-backend
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ktc4}
      DB_USERNAME: ${DB_USERNAME:-ktc4}
      DB_PASSWORD: ${DB_PASSWORD:-ktc4local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-net

  # AI 서비스. 백엔드가 `POST http://ai:8000/investigations` 로 부른다.
  #
  # 포트를 바깥으로 열지 않는다 — 백엔드만 부르면 되고, 열어 두면 공개 주소에서
  # 조사를 아무나 돌릴 수 있다(국세청·Vertex 쿼터가 걸린 호출이다).
  # 같은 db-net 안에 있어 서비스명으로 닿는다.
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ktc4-ai
    environment:
      # 컨테이너 안에서 백엔드는 localhost 가 아니라 서비스명이다.
      BACKEND_BASE_URL: ${AI_BACKEND_BASE_URL:-http://backend:8080}
      # 조사 구현 선택: web / mock / off. 비우면 GOOGLE_CLOUD_PROJECT 유무로 정해진다.
      INVESTIGATOR: ${INVESTIGATOR:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      backend:
        condition: service_started
    networks:
      - db-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8080}}
    container_name: ktc4-frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres-data:

networks:
  db-net:
