spring:
  application:
    name: ktc4-backend

  datasource:
    # ${환경변수:기본값} — 배포 환경에서는 환경변수로 덮어쓰고, 로컬은 기본값(docker-compose)을 씁니다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ktc4}
    username: ${DB_USERNAME:ktc4}
    password: ${DB_PASSWORD:ktc4local}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Postgres 드라이버가 DB 의 상세 메시지(Key (email)=(...), Failing row contains (...))를 예외 메시지에
        # 넣지 않게 한다. Hibernate 가 제약 위반을 ERROR 로그로 남길 때 이메일·대표자 이름·비밀번호 해시 같은
        # 입력값이 함께 남지 않게 하기 위해서다. URL 파라미터로 두지 않는 이유: 배포 환경은 DB_URL 로
        # URL 을 통째로 덮어써서 URL 에 붙인 설정이 사라진다.
        logServerErrorDetail: false

  jpa:
    hibernate:
      # update: 엔티티를 보고 없는 테이블·컬럼을 자동 생성합니다. (컬럼 삭제·타입변경은 반영 안 됨)
      ddl-auto: update
    open-in-view: false

server:
  port: 8080
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

auth:
  # 권한 검사 스위치. false 면 로그인 없이 기존 API 를 통과시킨다(로그인 API 는 동작).
  # /api/admin/**, /api/children/**, /api/auth/me 는 false 여도 막힌다.
  # 기본값은 켜짐(true)이다. 끄려면 서버 .env 에 AUTH_ENFORCE=false 를 명시한다.
  # ⚠️ 임시 설정 — 2026-10-14 까지 제거. 프론트 관리자 로그인 화면이 머지되고 AI 서버가 X-API-KEY 를 붙이면
  #    서버 .env 의 AUTH_ENFORCE=false 를 지운 뒤, 이 설정과 SecurityConfig 의 enforce 분기를 지운다.
  enforce: ${AUTH_ENFORCE:true}
  jwt:
    # 시크릿 기본값은 두지 않음(public repo). 비워 두면 기동할 때마다 임의 키를 만들어 앱은 뜨지만,
    # 재시작하면 발급한 토큰이 모두 무효가 된다 — 배포 환경에는 32바이트 이상 값을 반드시 주입한다.
    secret: ${JWT_SECRET:}
    # 앱이라 매번 다시 로그인하지 않도록 길게 둔다. 갱신 토큰(refresh)을 도입하면 짧게 줄인다.
    validity-days: 7
  admin:
    # 관리자는 가입 없이 기동 시 이 값으로 한 번 만든다. 비워 두면 만들지 않는다.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # AI 서버처럼 로그인하지 않는 서버가 X-API-KEY 헤더로 보내는 키. 비워 두면 키 인증을 끈다.
  internal-api-key: ${INTERNAL_API_KEY:}

external:
  # 외부 API 장애 시 무한 대기 방지 (기본값은 무제한 대기)
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  bizno:
    base-url: https://bizno.net/api/fapi
    # 시크릿 기본값은 두지 않음(public repo) — 로컬은 backend/.env, 배포는 환경변수로 주입
    api-key: ${BIZNO_API_KEY:}
    # 검색 결과 한 번에 몇 건까지 받을지. 무료 API의 "1일 200건" 제한은 호출 횟수 기준이라
    # 이 값을 올려도 쿼터 소모는 늘지 않는다(실측 확인됨) — 필요하면 여기 숫자만 바꾸면 됨.
    page-count: 50
  nts:
    base-url: https://api.odcloud.kr/api/nts-businessman/v1/status
    service-key: ${NTS_SERVICE_KEY:}

ai:
  # AI 조사 서버(FastAPI). 로컬은 uvicorn 기본 포트, 배포는 환경변수로 덮어쓴다.
  base-url: ${AI_BASE_URL:http://localhost:8000}
  connect-timeout-ms: 3000
  # AI 는 가게 한 곳에 최대 60초를 쓰고, 그 안에 못 끝내면 200 + failure 로 답한다(멘토 Q4).
  # 그보다 넉넉히 기다려 "AI 가 아예 답하지 않음"(AiReadTimeout)만 여기에 걸리게 한다.
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:75000}
  # AI 일시 오류(5xx·연결 실패)를 다시 시도하기 전 기다리는 시간. 두 번째 시도 전 한 번만 기다린다.
  retry-backoff-ms: 2000
