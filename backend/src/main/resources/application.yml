spring:
  application:
    name: ktc4-backend

  datasource:
    # ${환경변수:기본값} — 배포 환경에서는 환경변수로 덮어쓰고, 로컬은 기본값(docker-compose)을 씁니다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ktc4}
    username: ${DB_USERNAME:ktc4}
    password: ${DB_PASSWORD:ktc4local}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Postgres 드라이버가 DB 의 상세 메시지(Key (email)=(...), Failing row contains (...))를 예외 메시지에
        # 넣지 않게 한다. Hibernate 가 제약 위반을 ERROR 로그로 남길 때 이메일·대표자 이름·비밀번호 해시 같은
        # 입력값이 함께 남지 않게 하기 위해서다. URL 파라미터로 두지 않는 이유: 배포 환경은 DB_URL 로
        # URL 을 통째로 덮어써서 URL 에 붙인 설정이 사라진다.
        logServerErrorDetail: false

  servlet:
    multipart:
      # 파일 업로드(POST /api/files)는 로그인 없이 부르는 API 라 상한을 반드시 둔다. 한 요청에 파일 하나다.
      # 파일 하나: 가장 큰 종류(사업자등록증 10MB)에 맞춘다. 종류별 상한(사진 5MB)은 UploadKind 가 다시 본다.
      max-file-size: 10MB
      # 요청 전체: 파일 하나 10MB 에 kind 칸과 multipart 경계 몫으로 1MB 더.
      max-request-size: 11MB

  flyway:
    enabled: true
    # 이미 돌고 있는 DB(dev·prod)에는 표가 이미 있다. Flyway 는 빈 DB 가 아니면 멈추는 것이 기본이라,
    # 그런 DB 를 "V1 까지는 끝난 것"으로 도장 찍고 V2 부터 돌게 한다. 빈 DB 는 V1 부터 그냥 돈다.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # validate: 스키마를 건드리지 않고 엔티티와 맞는지만 본다. 어긋나면 기동이 멈춘다.
      #
      # 전에는 update 였다. 그건 표와 컬럼을 더하기만 해서, 이미 만들어진 CHECK 제약이나
      # NOT NULL 은 따라오지 않는다. 로컬은 DB 를 새로 만들어 쓰니 드러나지 않고 배포본만
      # 조용히 어긋나, 2026-09-18 부터 한 달 가까이 AI 조사가 죽어 있었다(PROMPT-159).
      #
      # 이제 스키마는 db/migration 의 SQL 이 바꾼다. 엔티티를 고쳤으면 마이그레이션도 같이 쓴다 —
      # 안 쓰면 여기서 기동이 멈춘다. 그게 이 설정의 목적이다.
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

auth:
  jwt:
    # 시크릿 기본값은 두지 않음(public repo). 비워 두면 기동할 때마다 임의 키를 만들어 앱은 뜨지만,
    # 재시작하면 발급한 토큰이 모두 무효가 된다 — 배포 환경에는 32바이트 이상 값을 반드시 주입한다.
    secret: ${JWT_SECRET:}
    # 앱이라 매번 다시 로그인하지 않도록 길게 둔다. 갱신 토큰(refresh)을 도입하면 짧게 줄인다.
    validity-days: 7
  admin:
    # 관리자는 가입 없이 기동 시 이 값으로 한 번 만든다. 비워 두면 만들지 않는다.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # AI 서버처럼 로그인하지 않는 서버가 X-API-KEY 헤더로 보내는 키. 비워 두면 키 인증을 끈다.
  internal-api-key: ${INTERNAL_API_KEY:}

upload:
  # 올라온 파일(가게 사진·사업자등록증)을 두는 폴더. 폴더는 처음 저장할 때 만든다.
  # 배포 환경은 컨테이너를 새로 만들어도 파일이 남도록 볼륨에 둔다(docker-compose.yml 의 backend-uploads).
  # 로컬 기본값은 실행한 자리의 uploads/ 다 — .gitignore 에 있어 커밋되지 않는다.
  dir: ${UPLOAD_DIR:./uploads}
  # 올리고 이 시간 안에 가입 신청에 싣지 않은 파일은 지운다(PendingUploadCleanupScheduler). 지우는 일은 15분마다 돈다.
  # 짧게 두는 이유: 쌓인 파일 상한(2000건)이 차면 지워질 때까지 모두의 업로드가 막힌다. 그 시간이 이 값 + 정리 주기다.
  pending-ttl-hours: ${UPLOAD_PENDING_TTL_HOURS:3}
  cleanup-interval-ms: ${UPLOAD_CLEANUP_INTERVAL_MS:900000}
  # 같은 곳에서 파일을 올리는 횟수 제한. 넘으면 429 (UploadRateLimitFilter). 메뉴가 많으면 가입 한 건에 수십 장이라
  # 가입 신청보다 넉넉히 둔다. 보낸 쪽을 가리는 프록시 수는 signup.rate-limit.trusted-proxies 를 함께 쓴다.
  rate-limit:
    max-attempts: ${UPLOAD_RATE_LIMIT_MAX_ATTEMPTS:60}
    window-minutes: ${UPLOAD_RATE_LIMIT_WINDOW_MINUTES:10}
    # 같은 곳에서 하루에 올릴 수 있는 파일 수(성공한 것만). 10분 한도만 있으면 한 곳에서 몇 시간 만에 쌓인 파일 상한을 채운다
    max-uploads-per-day: ${UPLOAD_RATE_LIMIT_MAX_UPLOADS_PER_DAY:150}

signup:
  # 점주 가입 신청을 같은 IP 에서 되풀이하는 횟수 제한. 넘으면 429 (SignupRateLimitFilter).
  # 여러 사람이 같은 와이파이로 가입할 수 있어 넉넉히 둔다. 횟수는 서버 메모리에 있어 다시 띄우면 초기화된다.
  rate-limit:
    max-attempts: ${SIGNUP_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-minutes: ${SIGNUP_RATE_LIMIT_WINDOW_MINUTES:10}
    # 같은 곳에서 하루에 성공할 수 있는 가입 수. 시도 횟수만 세면 한 곳에서 몇 시간 만에 승인 대기 상한(200건)을 채워
    # 가입 전체를 닫을 수 있다. 여러 점주가 한 자리에서 가입하는 행사가 있으면 이 값을 올린다.
    max-signups-per-day: ${SIGNUP_RATE_LIMIT_MAX_SIGNUPS_PER_DAY:5}
    # 서버 앞에 있는 우리 프록시의 수. 보낸 쪽 IP 를 X-Forwarded-For 의 오른쪽에서 이만큼째 값으로 정한다
    # (맨 왼쪽은 보내는 쪽이 마음대로 적을 수 있다). ⚠️ 실제 구성과 다르면 안 된다 —
    # 실제보다 작으면 모든 사용자가 프록시 주소 하나로 묶여 전체가 10분에 10번만 가입할 수 있고,
    # 실제보다 크면 보내는 쪽이 적은 값을 믿게 되어 제한을 피해 갈 수 있다.
    # 기본값은 0(프록시 없이 직접 받음 — 헤더를 보지 않는다)이다. 틀렸을 때 조용히 뚫리는 쪽이 아니라 바로 드러나는 쪽이다.
    # 프록시 뒤에 있는 서버만 그 대수를 넣는다(개발 서버는 docker-compose.dev.yml 에서 1).
    trusted-proxies: ${SIGNUP_TRUSTED_PROXIES:0}
  # 가입 신청 본문(JSON)의 상한(바이트). 넘으면 413 (SignupRateLimitFilter). 본문은 다 읽은 뒤에야 칸별 검증이 돌아서,
  # 상한이 없으면 큰 JSON 이 메모리에 다 올라간 뒤에 거절된다. 메뉴 50개·영업시간 21줄을 꽉 채워도 20KB 안쪽이다.
  max-body-bytes: ${SIGNUP_MAX_BODY_BYTES:65536}

external:
  # 외부 API 장애 시 무한 대기 방지 (기본값은 무제한 대기)
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  bizno:
    base-url: https://bizno.net/api/fapi
    # 시크릿 기본값은 두지 않음(public repo) — 로컬은 backend/.env, 배포는 환경변수로 주입
    api-key: ${BIZNO_API_KEY:}
    # 검색 결과 한 번에 몇 건까지 받을지. 무료 API의 "1일 200건" 제한은 호출 횟수 기준이라
    # 이 값을 올려도 쿼터 소모는 늘지 않는다(실측 확인됨) — 필요하면 여기 숫자만 바꾸면 됨.
    page-count: 50
  nts:
    base-url: https://api.odcloud.kr/api/nts-businessman/v1/status
    service-key: ${NTS_SERVICE_KEY:}

ai:
  # AI 조사 서버(FastAPI). 로컬은 uvicorn 기본 포트, 배포는 환경변수로 덮어쓴다.
  # docker compose 로 띄우면 컨테이너 안의 localhost 는 백엔드 자기 자신이라 AI 에 닿지 않는다.
  # 그래서 docker-compose.yml 이 backend 에 AI_BASE_URL=http://ai:8000 을 넣어 준다.
  base-url: ${AI_BASE_URL:http://localhost:8000}
  # AI 를 부를 때 X-API-KEY 로 싣는 키. AI 가 들어오는 요청을 검사할 때 쓰는 값과 같다
  # (auth.internal-api-key 와 한 환경변수를 본다). 비우면 헤더를 붙이지 않는다.
  api-key: ${INTERNAL_API_KEY:}
  connect-timeout-ms: 3000
  # AI 는 가게 한 곳에 최대 60초를 쓰고, 그 안에 못 끝내면 200 + failure 로 답한다(멘토 Q4).
  # 그보다 넉넉히 기다려 "AI 가 아예 답하지 않음"(AiReadTimeout)만 여기에 걸리게 한다.
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:75000}
  # AI 일시 오류(5xx·연결 실패)를 다시 시도하기 전 기다리는 시간. 두 번째 시도 전 한 번만 기다린다.
  retry-backoff-ms: 2000
