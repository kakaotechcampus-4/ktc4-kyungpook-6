# ⚠️ 로컬 개발 전용입니다.
#    운영 DB 주소·비밀번호를 여기에 적지 마세요. 이 repo 는 public 입니다.
#    운영 값은 배포 환경의 환경변수(DB_URL / DB_USERNAME / DB_PASSWORD)로만 주입합니다.
#
# 아래 계정이 공개돼 있어도 안전한 이유:
#   포트를 127.0.0.1 에만 바인딩해서 이 컴퓨터 밖에서는 접속이 불가능하기 때문입니다.
#   (0.0.0.0 으로 열면 같은 와이파이의 다른 사람이 접속할 수 있습니다)
#
# 값을 바꾸고 싶으면 .env.example 을 복사해 .env 로 만들어 채우세요 (docker compose 가 자동으로 읽습니다).
# .env 가 없어도 아래 fallback 값으로 그대로 동작합니다.

services:
  postgres:
    image: postgres:16
    container_name: ktc4-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ktc4}
      POSTGRES_USER: ${POSTGRES_USER:-ktc4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktc4local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktc4-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      # host가 "postgres" 인 이유: 같은 docker-compose 네트워크 안에서는
      # 서비스명으로 접속합니다 (localhost 는 컨테이너 자기 자신을 가리킴).
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ktc4}
      DB_USERNAME: ${DB_USERNAME:-ktc4}
      DB_PASSWORD: ${DB_PASSWORD:-ktc4local}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
