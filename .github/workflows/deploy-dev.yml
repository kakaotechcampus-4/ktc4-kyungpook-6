name: Deploy to Dev Environment

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-local
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 🚨 지우지 마세요. 서버 `.env` 가 레포 안(러너 작업 폴더)에 있습니다.
          #    기본값 true 는 체크아웃 전에 추적되지 않는 파일을 정리하므로, `.env` 가
          #    날아가고 백엔드가 **시크릿 없이 조용히 뜹니다**(값이 없어도 멈추지 않음 —
          #    `docker-compose.dev.yml` 주석 참고).
          #    `.env` 를 레포 밖으로 옮기고 `docker compose --env-file` 로 가리키면
          #    이 옵션이 필요 없어집니다. 그때 함께 지우세요.
          clean: false

      # Vertex 는 API 키가 아니라 서비스 계정 JSON(ADC)으로 인증한다. 그 파일을 저장소에 둘 수 없고
      # 서버 .env 는 SSH 가 막혀 손댈 수 없으므로, GitHub Secrets 에서 내려받아 서버 홈에 둔다.
      # 레포 밖(~/.ktc4)에 두는 이유: 체크아웃의 clean 정책과 무관하게 남고, 실수로 커밋될 수 없다.
      - name: Vertex 서비스 계정 키 준비
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${SA:-}" ]; then
            echo "::warning::GCP_SA_KEY 가 없습니다 — AI 조사는 503 으로 돕니다(화면은 정상)"
            exit 0
          fi
          mkdir -p "$HOME/.ktc4" && chmod 700 "$HOME/.ktc4"
          printf '%s' "$SA" > "$HOME/.ktc4/vertex.json"
          chmod 600 "$HOME/.ktc4/vertex.json"
          python3 -c "import json;d=json.load(open('$HOME/.ktc4/vertex.json'));print('서비스 계정:', d['client_email'])"

      - name: Rebuild and restart containers
        env:
          # compose 는 셸 환경변수를 --env-file 보다 먼저 읽는다. 그래서 서버 .env 를 고치지 않고
          # 여기서 넘긴다. 값이 없으면 compose 기본값(빈 값·false)으로 떨어져 지금과 같이 돈다.
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          # 스위치는 비밀이 아니라 저장소 변수로 둔다 — 값이 보이는 편이 켜졌는지 알기 쉽다.
          NAVER_LOCAL_ENABLED: ${{ vars.AI_NAVER_LOCAL_ENABLED || 'false' }}
          KAKAO_COMPARE_ENABLED: ${{ vars.AI_KAKAO_COMPARE_ENABLED || 'false' }}
          AGENT_ENABLED: ${{ vars.AI_AGENT_ENABLED || 'false' }}
          AGENT_MODEL: ${{ vars.AI_AGENT_MODEL || '' }}
        run: |
          # 키 파일이 있을 때만 가리킨다. 없으면 compose 기본값(/dev/null)이 들어가 503 이 된다.
          if [ -f "$HOME/.ktc4/vertex.json" ]; then
            export VERTEX_KEY_PATH="$HOME/.ktc4/vertex.json"
          fi
          ./scripts/deploy.sh dev up -d --build --remove-orphans

      - name: Remove dangling images
        run: docker image prune -f
