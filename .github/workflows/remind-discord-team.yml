# 매 시간 돌면서 사람이 손써야 하는 PR 만 알린다.
#
# 봇이 아니라 schedule(cron) + 웹훅이다. 알림만 보내면 되니 24시간 켜둘 서버가 필요 없다.
# 판단 로직은 .github/scripts/remind_discord.py 에 있다 (로컬에서 --dry-run 으로 돌려볼 수 있다).
#
# ⚠️ 운영진 소유 3개 파일은 건드리지 않는다. 시크릿도 공용 DISCORD_WEBHOOK 이 아니라
#    팀 전용 DISCORD_WEBHOOK_TEAM 을 쓴다. 없으면 아무것도 보내지 않는다.
name: Remind Discord (stale PR)

on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각 (UTC). 판단은 스크립트가 KST 로 환산해서 한다

  # 🚨 **cron 만으로는 모자란다.** `0 * * * *` 인데 실제로는 5~7시간에 한 번 돌았다
  #    (2026-10-07: 34.6시간 동안 7번, 기대치의 20%). GitHub 의 예약 실행은 부하가 걸리면
  #    밀리거나 통째로 건너뛴다. 그래서 "1시간째 리뷰가 없습니다" 가 5시간 뒤에 간다.
  #
  #    PR 이벤트로 도는 워크플로는 안 밀린다 — 같은 24시간에 알림 워크플로는 37회,
  #    테스트는 22회 돌았다. 그게 끝날 때 같이 깨운다.
  #
  #    자주 돌아도 안전한 이유 — 판정 구간이 "직전 성공한 실행 이후"(cron·workflow_run 둘 다
  #    구간을 앞당긴다)라서, 몇 번을 더 돌든 같은 건이 두 번 나가지 않는다.
  #    보낼 게 없으면 조용히 끝난다. 수동 실행은 구간을 앞당기지 않는다 —
  #    점검 발송 한 번이 그 사이 알림을 삼키면 안 되기 때문이다.
  workflow_run:
    workflows: ["Notify Discord (team PR)", "Test"]
    types: [completed]
  workflow_dispatch:      # 수동 확인용
    inputs:
      catch_up:
        description: "밀린 건을 한 번에 알립니다 (시간 구간 무시). 워크플로가 멈췄다 돌아왔거나, 규칙을 바꿔 소급 적용할 때."
        type: boolean
        default: false
      test_send:
        description: "점검용 한 줄만 보냅니다. PR 은 보지 않고, 누른 사람만 멘션합니다(다른 분께는 알림이 가지 않습니다)."
        type: boolean
        default: false

# 🚨 **한 번에 하나만 돈다.** 트리거가 셋(cron · workflow_run · 수동)이라 겹칠 수 있는데,
#    두 실행이 동시에 돌면 **같은 "직전 실행 시각"을 읽어 같은 건을 두 번 보낸다.**
#    cancel-in-progress 는 false — 취소하면 그 구간 알림이 통째로 사라진다. 줄 세워서 보낸다.
#    뒤에 선 실행은 앞 실행이 끝난 뒤에 돌므로 갱신된 시각을 읽는다.
concurrency:
  group: remind-discord-team
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Check and notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_TEAM: ${{ secrets.DISCORD_WEBHOOK_TEAM }}
          # 멘션 대상 매핑 (형식: .github/discord-members.example.json)
          DISCORD_MEMBERS: ${{ secrets.DISCORD_MEMBERS }}
          # 알림을 채널이 아니라 그 안의 스레드 하나로 보낸다 (📋 PR 현황판).
          # 비워 두면 지금까지처럼 채널로 간다.
          # 스레드 ID 는 비밀이 아니라서 시크릿이 아닌 저장소 변수(Variables)에 둔다.
          # 변수는 값을 다시 읽을 수 있다 — 시크릿은 넣고 나면 못 읽어서, 빈 값이
          # 들어가도 성공한 것처럼 조용히 넘어간다. 실제로 두 번 겪었다.
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
        run: |
          python3 .github/scripts/remind_discord.py \
            ${{ inputs.test_send && '--test' || '' }} \
            ${{ inputs.catch_up && '--catch-up' || '' }}
