# 매 시간 돌면서 사람이 손써야 하는 PR 만 알린다.
#
# 봇이 아니라 schedule(cron) + 웹훅이다. 알림만 보내면 되니 24시간 켜둘 서버가 필요 없다.
# 판단 로직은 .github/scripts/remind_discord.py 에 있다 (로컬에서 --dry-run 으로 돌려볼 수 있다).
#
# ⚠️ 운영진 소유 3개 파일은 건드리지 않는다. 시크릿도 공용 DISCORD_WEBHOOK 이 아니라
#    팀 전용 DISCORD_WEBHOOK_TEAM 을 쓴다. 없으면 아무것도 보내지 않는다.
name: Remind Discord (stale PR)

on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각 (UTC). 판단은 스크립트가 KST 로 환산해서 한다
  workflow_dispatch:      # 수동 확인용
    inputs:
      catch_up:
        description: "밀린 건을 한 번에 알립니다 (시간 구간 무시). 워크플로가 멈췄다 돌아왔거나, 규칙을 바꿔 소급 적용할 때."
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Check and notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_TEAM: ${{ secrets.DISCORD_WEBHOOK_TEAM }}
          # 멘션 대상 매핑 (형식: .github/discord-members.example.json)
          DISCORD_MEMBERS: ${{ secrets.DISCORD_MEMBERS }}
          # 알림을 채널이 아니라 그 안의 스레드 하나로 보낸다 (📋 PR 현황판).
          # 비워 두면 지금까지처럼 채널로 간다.
          # 스레드 ID 는 비밀이 아니라서 시크릿이 아닌 저장소 변수(Variables)에 둔다.
          # 변수는 값을 다시 읽을 수 있다 — 시크릿은 넣고 나면 못 읽어서, 빈 값이
          # 들어가도 성공한 것처럼 조용히 넘어간다. 실제로 두 번 겪었다.
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
        run: |
          python3 .github/scripts/remind_discord.py \
            ${{ inputs.catch_up && '--catch-up' || '' }}
