name: Test

on:
  pull_request:
    branches: [develop, main]

jobs:
  # 바뀐 폴더만 테스트한다. 이 워크플로 파일이 바뀌면 파이프라인 자체를 검증하도록 모두 돈다.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
      frontend: ${{ steps.filter.outputs.frontend }}
      bot: ${{ steps.filter.outputs.bot }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/test.yml'
            ai:
              - 'ai/**'
              # 🚨 ai/tests/backend_client/test_contract.py 가 **백엔드 Java 소스를 직접 읽어**
              #    양쪽 enum·DTO 를 대조한다. 백엔드가 값을 바꾸면 깨지라고 만든 테스트라,
              #    여기 백엔드를 안 넣으면 **백엔드가 바꿀 때만 안 도는** 모양이 된다.
              #    (5주차 가게 상태, 6주차 Task 분류가 그렇게 갈라져 멘토 리뷰에서 지적받았다.)
              - 'backend/src/main/java/com/ktc4/backend/domain/**'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/test.yml'
            bot:
              - 'bot/**'
              - '.github/workflows/test.yml'
            scripts:
              - '.github/scripts/**'
              - '.github/workflows/test.yml'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run backend tests
        run: ./scripts/test.sh
        working-directory: backend

  ai-test:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ai/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run AI tests
        run: ./scripts/test.sh
        working-directory: ai

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: ./scripts/test.sh
        working-directory: frontend

  bot-test:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bot

      - name: Run bot tests
        run: npm test
        working-directory: bot

      - name: Typecheck bot
        run: npm run typecheck
        working-directory: bot

  # 알림 스크립트(.github/scripts/)의 시각 판정 회귀 테스트.
  # 조용한 시간 경계·중복·구간 계산은 전부 사고가 나서 고친 것들이라, 자동으로 안 돌면
  # 다음에 한 줄 고칠 때 조용히 깨진다. 의존성이 표준 라이브러리뿐이라 20초면 끝난다.
  scripts-test:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Run script tests
        run: python -m pytest .github/scripts/tests -q

  all-tests-passed:
    name: All tests passed
    needs: [changes, backend-test, ai-test, frontend-test, bot-test, scripts-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "하나 이상의 테스트가 실패했습니다."
            exit 1
          fi
