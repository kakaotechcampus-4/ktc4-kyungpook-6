name: Dev DB Maintenance

# 개발 서버 DB 의 **CHECK 제약**을 보고, 필요하면 하나를 지운다.
#
# 왜 필요한가 — 우리는 스키마를 `ddl-auto: update` 로 맞춘다. 그 설정은 컬럼과 표는 따라오지만
# **CHECK 제약은 한 번 만들어지면 고치지 않는다.** enum 값 이름을 바꾸면 DB 쪽 제약은 옛 이름을
# 그대로 들고 있어서, 새 값을 넣는 순간 23514 로 거절된다.
#
# 2026-10-16 에 실제로 그랬다. 2026-09-18 에 TaskClassification 이
#   TASK_HIGH · TASK_LOW · TASK_NONE  →  PRIORITY_CHECK · ADDITIONAL_CHECK · NO_CHANGE
# 로 바뀌었는데(e0f6a4e), 개발 서버 DB 의 task_classification_check 는 옛 이름 그대로였다.
# 그래서 **한 달 가까이 배포본의 조사가 1차 결과 저장에서 죽고 있었다.** 화면에는 "실패" 만
# 떠서 아무도 눈치채지 못했다.
#
# ⚠️ 근본 해결은 마이그레이션 도구(Flyway 등)다. 이 워크플로는 그때까지 쓰는 손도구다.
#
# 기본은 **읽기만** 한다. 지우려면 constraint 입력에 이름을 정확히 적어야 한다.

on:
  workflow_dispatch:
    inputs:
      table:
        description: 제약을 지울 표 이름 (비우면 목록만 보여 준다)
        required: false
        default: ""
      constraint:
        description: 지울 CHECK 제약 이름 (table 과 함께 적어야 지운다)
        required: false
        default: ""
      recreate_schema:
        description: "스키마를 통째로 새로 만들려면 RECREATE 라고 정확히 적는다 (자료가 전부 사라진다)"
        required: false
        default: ""

jobs:
  maintenance:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 🚨 배포와 같은 이유로 지우지 않는다 — 서버 `.env` 가 러너 작업 폴더에 있다.
          clean: false

      - name: 지금 걸려 있는 CHECK 제약
        run: |
          # 접속 정보는 **서버 .env** 에서 읽는다. 저장소 변수에 적어 두면 두 곳이 어긋난다.
          # (2026-10-16: 변수가 비어 기본값 ktc4 로 붙었다가 role 이 없다고 거절당했다.)
          PGU=$(grep -E "^POSTGRES_USER=" .env | tail -1 | cut -d= -f2-)
          PGD=$(grep -E "^POSTGRES_DB=" .env | tail -1 | cut -d= -f2-)
          echo "사용자 ${#PGU}자 · DB ${PGD:-?}"
          docker exec ktc4-postgres psql -U "${PGU:-ktc4}" -d "${PGD:-ktc4}" -c "
            select rel.relname as table_name, con.conname as constraint_name,
                   pg_get_constraintdef(con.oid) as definition
            from pg_constraint con
            join pg_class rel on rel.oid = con.conrelid
            join pg_namespace ns on ns.oid = rel.relnamespace
            where con.contype = 'c' and ns.nspname = 'public'
            order by rel.relname, con.conname;"

      - name: 제약 지우기 (입력이 있을 때만)
        if: ${{ inputs.table != '' && inputs.constraint != '' }}
        env:
          TABLE: ${{ inputs.table }}
          CONSTRAINT_NAME: ${{ inputs.constraint }}
        run: |
          PGU=$(grep -E "^POSTGRES_USER=" .env | tail -1 | cut -d= -f2-)
          PGD=$(grep -E "^POSTGRES_DB=" .env | tail -1 | cut -d= -f2-)
          echo "지웁니다: $TABLE / $CONSTRAINT_NAME"
          docker exec ktc4-postgres psql -U "${PGU:-ktc4}" -d "${PGD:-ktc4}" \
            -c "alter table \"$TABLE\" drop constraint if exists \"$CONSTRAINT_NAME\";"
          echo "== 지운 뒤 =="
          docker exec ktc4-postgres psql -U "${PGU:-ktc4}" -d "${PGD:-ktc4}" -c "
            select con.conname, pg_get_constraintdef(con.oid)
            from pg_constraint con
            join pg_class rel on rel.oid = con.conrelid
            where con.contype = 'c' and rel.relname = '$TABLE';"

      # 🔴 되돌릴 수 없다. 입력에 RECREATE 를 정확히 적어야만 돈다.
      #
      # 왜 필요한가 — ddl-auto: update 는 표와 컬럼을 **더하기만** 한다. 이름이 바뀐 enum 의
      # CHECK 제약도, 느슨해진 NOT NULL 도 따라오지 않는다. 2026-10-16 에 개발 서버 DB 가
      # 그 상태였다 — 제약 하나를 지우면 다음 겹이 나오는 식이라 몇 겹인지 알 수 없었다.
      #
      #   task_classification_check = ARRAY['TASK_HIGH','TASK_LOW','TASK_NONE']  (2026-09-18 에 버려진 이름)
      #   signal.confidence   NOT NULL   (코드는 nullable)
      #   task.classification NOT NULL   (코드는 nullable)
      #
      # 비우고 다시 만들면 Hibernate 가 지금 엔티티대로 만든다. 관리자 계정은 기동할 때
      # .env 의 ADMIN_EMAIL·ADMIN_PASSWORD 로 다시 생긴다.
      #
      # ⚠️ 근본 해결은 마이그레이션 도구(Flyway 등)다. 이건 그때까지 쓰는 손도구다.
      - name: 스키마 새로 만들기 (RECREATE 라고 적었을 때만)
        if: ${{ inputs.recreate_schema == 'RECREATE' }}
        run: |
          PGU=$(grep -E "^POSTGRES_USER=" .env | tail -1 | cut -d= -f2-)
          PGD=$(grep -E "^POSTGRES_DB=" .env | tail -1 | cut -d= -f2-)
          psql_() { docker exec ktc4-postgres psql -U "${PGU:-ktc4}" -d "${PGD:-ktc4}" "$@"; }

          echo "== 지우기 전 표별 행 수 =="
          psql_ -At -c "select table_name||' = '||(xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' order by table_name;"

          echo "== 스키마를 새로 만든다 =="
          psql_ -c "drop schema public cascade;"
          psql_ -c "create schema public;"
          psql_ -c "grant all on schema public to \"${PGU:-ktc4}\"; grant all on schema public to public;"

          echo "== 백엔드를 다시 띄워 Hibernate 가 표를 만들게 한다 =="
          docker restart ktc4-backend
          for i in $(seq 1 40); do
            code=$(docker exec ktc4-backend sh -c 'command -v curl >/dev/null && curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://localhost:8080/ping || echo 000')
            echo "  [$i] /ping $code"
            [ "$code" = "200" ] && break
            sleep 3
          done

          echo "== 다시 만든 뒤 =="
          psql_ -At -c "select count(*) || ' 개 표' from information_schema.tables where table_schema='public';"
          psql_ -c "select con.conname, pg_get_constraintdef(con.oid) from pg_constraint con join pg_class rel on rel.oid=con.conrelid where con.contype='c' and rel.relname in ('task','signal');"
