name: Deploy to Main Environment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc4-kyungpook-6-deploy
          aws-region: ap-northeast-2

      - name: 운영 EC2 인스턴스 ID 조회
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ktc4-team-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::실행 중인 인스턴스를 찾지 못했습니다 (Name=ktc4-team-server)"
            exit 1
          fi

          echo "instance-id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: SSM으로 배포 명령 전송
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }} to prod" \
            --parameters '{"commands":["set -euo pipefail","cd /home/ubuntu/ktc4-kyungpook-6","git fetch origin main","git reset --hard ${{ github.sha }}","./scripts/deploy.sh prod up -d --build --remove-orphans","docker image prune -f"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: 배포 완료 대기
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send-command.outputs.command-id }}" \
            --instance-id "${{ steps.ec2.outputs.instance-id }}"

      - name: 배포 로그 출력
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send-command.outputs.command-id }}" \
            --instance-id "${{ steps.ec2.outputs.instance-id }}"
