name: Deploy to Main Environment

on:
  push:
    branches:
      - main
  # 손으로도 돌린다. 이게 없으면 main 에 push 될 때(= develop→main 머지, 주간 멘토 리뷰 PR)만
  # 돌아서, 배포를 고쳐도 다음 주까지 시험해 볼 방법이 없다.
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 커밋/브랜치 (비우면 main)
        required: false
        default: main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc4-kyungpook-6-deploy
          aws-region: ap-northeast-2

      - name: 운영 EC2 인스턴스 ID 조회
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ktc4-team-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::실행 중인 인스턴스를 찾지 못했습니다 (Name=ktc4-team-server)"
            exit 1
          fi

          echo "instance-id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # 보내는 명령은 네 줄로 두고, 실제 배포 로직은 scripts/prod-remote-deploy.sh 에 둔다.
      # 두 가지 이유다.
      #  ① **비밀값을 여기 실을 수 없다.** send-command 의 파라미터는 SSM 콘솔의 Command history 와
      #     CloudTrail, 그리고 이 Actions 로그에 그대로 남는다. 그래서 dev(deploy-dev.yml)처럼
      #     워크플로 `env:` 로 키를 넘기는 수법을 prod 에는 쓸 수 없다. 서버가 파라미터 스토어에서
      #     직접 받아 가고, 명령에는 **이름만** 남는다.
      #  ② JSON 배열에 긴 셸을 밀어 넣으면 아무도 리뷰할 수 없다.
      - name: SSM으로 배포 명령 전송
        id: send-command
        env:
          REF: ${{ inputs.ref || 'main' }}
          SHA: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }} to prod" \
            --parameters '{"commands":["set -eu","cd /home/ubuntu/ktc4-kyungpook-6","git fetch origin '"${REF}"'","git reset --hard '"${SHA}"'","./scripts/prod-remote-deploy.sh","docker image prune -f"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # `aws ssm wait command-executed` 를 쓰지 않는다. 기본 Waiter 가 20회×5초 = 100초인데
      # 보내는 명령은 deploy.sh prod up -d --build(Gradle+npm 빌드)라 그 안에 끝날 수 없었다.
      # 2026-10-14 재실행이 그래서 "Waiter CommandExecuted failed: Max attempts exceeded" 로
      # 죽었다 — 명령은 서버에서 계속 돌고 있었는데 워크플로만 먼저 포기한 것이다.
      # 게다가 그렇게 죽으면 StandardOutputContent 가 비어서 원인이 하나도 안 남았다.
      - name: 배포 완료 대기 (15초마다, 최대 20분)
        id: wait
        env:
          CID: ${{ steps.send-command.outputs.command-id }}
          IID: ${{ steps.ec2.outputs.instance-id }}
        run: |
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CID" --instance-id "$IID" \
              --query "Status" --output text)
            echo "[$i/80] $STATUS"
            case "$STATUS" in
              Success)                       echo "status=$STATUS" >> "$GITHUB_OUTPUT"; exit 0 ;;
              Failed|Cancelled|TimedOut)     echo "status=$STATUS" >> "$GITHUB_OUTPUT"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::20분 안에 끝나지 않았습니다. 서버에서는 계속 돌고 있을 수 있습니다 (command-id $CID)"
          echo "status=Timeout" >> "$GITHUB_OUTPUT"
          exit 1

      - name: 배포 로그 출력
        if: always()
        env:
          CID: ${{ steps.send-command.outputs.command-id }}
          IID: ${{ steps.ec2.outputs.instance-id }}
        run: |
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query "{Status:Status,Detail:StatusDetails,Code:ResponseCode}" --output table
          echo "── 표준 출력 ─────────────────────────────"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query "StandardOutputContent" --output text
          echo "── 표준 에러 ─────────────────────────────"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query "StandardErrorContent" --output text
