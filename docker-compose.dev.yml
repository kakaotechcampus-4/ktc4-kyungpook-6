# dev 환경 오버라이드 파일입니다.
# docker-compose.yml(base) 위에 병합해서 사용합니다 — 직접 쓰지 말고 scripts/deploy.sh 를 사용하세요.
#   예) scripts/deploy.sh dev up -d --build
#
# 값은 GitHub Actions Secrets 로 주입합니다(.github/workflows/deploy-dev.yml).
# compose 는 .env·셸 환경변수를 ${...} 치환에만 쓰고, 여기 environment: 에 적은 것만 컨테이너에 들어갑니다.
# ${VAR:?} 는 값이 없으면 배포를 멈춥니다 — 시크릿 없이 뜬 서버가 조용히 잘못 동작하는 것을 막기 위해서입니다.
# 현재는 Dev에서만 관련 기능을 사용하고 있기 때문에 Dev에만 배포중이며, Frontend와 연동 이후 해당 환경 변수를 docker-compose.yml에서 전달하도록 변경 예정.
services:
  backend:
    environment:
      AUTH_ENFORCE: ${AUTH_ENFORCE:-false}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BIZNO_API_KEY: ${BIZNO_API_KEY}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY}
