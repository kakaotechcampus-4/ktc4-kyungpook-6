# dev 오버라이드. base 위에 병합합니다 — scripts/deploy.sh dev up -d --build
#
# 값은 각 서버의 .env 로 관리합니다. dev 전용 값은 .env.development 에 둡니다.
# 여기 environment: 에 적은 것만 컨테이너에 들어갑니다 — 적지 않으면 .env 에 있어도 안 들어갑니다.
# 자세한 것은 docs/배포환경에서_작업하는_방법.md.

services:
  postgres:
    ports:
      - "0.0.0.0:${POSTGRES_PORT:?}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

  backend:
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BIZNO_API_KEY: ${BIZNO_API_KEY}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY}
      # dev 는 nginx 프록시 한 대 뒤에 있습니다. 프록시가 없는 서버에는 넣지 마세요.
      SIGNUP_TRUSTED_PROXIES: ${SIGNUP_TRUSTED_PROXIES:-1}

  # dev 에서만 AI 포트를 엽니다. 열면 누구나 POST /investigations 를 부를 수 있어
  # INTERNAL_API_KEY 를 :? 로 필수로 둡니다(AI 는 키가 있을 때만 X-API-KEY 를 검사합니다).
  ai:
    ports:
      - "0.0.0.0:${AI_PORT:-8000}:8000"
    environment:
      # 브라우저가 읽는 PUBLIC_BACKEND_URL 과는 다른 값입니다(내부 주소).
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
