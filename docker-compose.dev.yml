# dev 환경 오버라이드 파일입니다.
# docker-compose.yml(base) 위에 병합해서 사용합니다 — 직접 쓰지 말고 scripts/deploy.sh 를 사용하세요.
#   예) scripts/deploy.sh dev up -d --build
#
# 값은 **각 서버의 .env** 로 관리합니다. dev 에서만 쓰는 값(POSTGRES_PORT·AI_PORT·AI_BASE_URL)은 .env.development 에
# 둡니다 — scripts/deploy.sh dev 가 .env 위에 얹어 읽습니다(.env.development.example 참고).
# compose 는 그 파일들을 ${...} 치환에만 쓰고,
# 여기 environment: 에 적은 것만 컨테이너에 들어갑니다 — 적지 않으면 .env 에 있어도 안 들어갑니다.
# 배포(.github/workflows/deploy-dev.yml)는 checkout 의 clean: false 에 기대어 서버 .env 를 지우지
# 않습니다. 그 옵션을 true 로 바꾸면 gitignore 대상인 .env 가 지워지니 바꾸지 마세요.
#
# ${VAR} 로 두었으므로 **값이 비어도 배포는 멈추지 않고 빈 값이 들어갑니다.** 멈추게 하려면 ${VAR:?} 로
# 바꾸면 됩니다. 지금은 서버 .env 에 값을 채워 두는 운영 방식을 택해 멈추지 않는 쪽으로 두었습니다.
#
# 현재는 dev 에서만 쓰므로 여기 둡니다. prod 에도 필요해지면 두 환경에 같은 줄을 반복하지 않도록
# base(docker-compose.yml)로 옮깁니다.
services:
  postgres:
    ports:
      - "0.0.0.0:${POSTGRES_PORT:?}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

  backend:
    environment:
      # 백엔드가 부를 AI 주소. base 는 http://ai:8000 으로 고정이고, dev 에서만 .env.development 로 바꿀 수 있다.
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BIZNO_API_KEY: ${BIZNO_API_KEY}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY}

  # dev 에서만 AI 서버를 바깥에 연다(조사 동작을 직접 확인하려고). prod 는 base 대로 닫아 둔다.
  # 열면 공개 주소에서 누구나 POST /investigations 를 부를 수 있다 — Vertex·국세청 쿼터가 걸린 호출이다.
  # AI 는 INTERNAL_API_KEY 가 있을 때만 X-API-KEY 를 검사하므로(비면 검사 안 함), 여기서는 :? 로 필수로 둔다.
  ai:
    ports:
      - "0.0.0.0:${AI_PORT:-8000}:8000"
    environment:
      # AI 가 백엔드를 부르는 주소. 브라우저가 읽는 공개 주소(PUBLIC_BACKEND_URL)와는 다른 값이다 —
      # 한 키를 두 뜻으로 쓰다가 10주차 리뷰에서 지적받아 갈랐다.
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      # 개발 서버는 nginx 프록시 한 대 뒤에 있다. 가입 신청 횟수 제한이 보낸 쪽 IP 를 X-Forwarded-For 에서 읽는다
      # (backend application.yml 의 signup.rate-limit.trusted-proxies 참고). 프록시가 없는 서버에는 넣지 않는다.
      SIGNUP_TRUSTED_PROXIES: ${SIGNUP_TRUSTED_PROXIES:-1}
