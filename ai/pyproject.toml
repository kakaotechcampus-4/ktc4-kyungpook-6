[project]
name = "store-info-agent"
version = "0.1.0"
description = "가게 정보가 바뀌었는지 조사해 수정안을 돌려주는 AI 서버. 사업자등록증 읽기도 맡는다."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.115.0",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
